<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Оцінювання якості шаф · JYSK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EAEFEA;
    --paper: #FFFFFF;
    --ink: #16241E;
    --ink-soft: #55645B;
    --ink-faint: #8B9990;
    --pine: #1F3A32;
    --pine-deep: #142720;
    --line: #D7DFD8;
    --line-soft: #E4EAE4;
    --red: #C6272B;
    --red-soft: #F6DEDD;
    --amber: #C98A17;
    --amber-soft: #F5E7C9;
    --green: #2E7D4F;
    --green-soft: #DCEEE2;
    --grey: #8B9990;
    --grey-soft: #E7EAE6;
    --radius-s: 6px;
    --radius-m: 10px;
    --radius-l: 16px;
    --shadow: 0 1px 2px rgba(20,39,32,0.06), 0 8px 24px -12px rgba(20,39,32,0.18);
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Manrope', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height:100vh;
  }
  .wrap{
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 24px 80px;
  }

  /* ---------- Header ---------- */
  header.top{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap: 24px;
    flex-wrap: wrap;
    margin-bottom: 22px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--line);
  }
  .brandmark{
    display:flex; align-items:center; gap:10px;
    font-size: 13px; font-weight:700; letter-spacing:.02em;
    color: var(--ink-faint);
    margin-bottom: 10px;
  }
  .brandmark .dot{
    width:7px; height:7px; border-radius:50%; background: var(--red);
  }
  h1.title{
    font-family:'Unbounded', sans-serif;
    font-weight: 600;
    font-size: clamp(26px, 3.2vw, 38px);
    line-height: 1.08;
    margin: 0;
    color: var(--pine-deep);
    letter-spacing: -0.01em;
  }
  .top-stats{
    display:flex; gap: 26px; flex-wrap: wrap;
  }
  .top-stat{ text-align:right; }
  .top-stat .num{
    font-family:'Unbounded', sans-serif;
    font-size: 26px; font-weight:600;
    color: var(--pine-deep);
    line-height:1;
  }
  .top-stat .lbl{
    font-size: 12.5px; color: var(--ink-faint);
    margin-top: 5px;
    max-width: 140px;
  }

  /* ---------- Breadcrumb ---------- */
  nav.crumb{
    display:flex; align-items:center; flex-wrap:wrap;
    gap: 4px;
    margin-bottom: 26px;
    font-size: 14.5px;
  }
  nav.crumb button{
    background:none; border:none; cursor:pointer;
    font-family:'Manrope', sans-serif;
    font-size: 14.5px; font-weight:600;
    color: var(--ink-faint);
    padding: 5px 9px;
    border-radius: var(--radius-s);
  }
  nav.crumb button:hover{ background: var(--paper); color: var(--pine); }
  nav.crumb button.current{ color: var(--pine-deep); cursor:default; }
  nav.crumb button.current:hover{ background:none; }
  nav.crumb .sep{ color: var(--ink-faint); opacity:.5; font-size:13px; }

  /* ---------- Section header ---------- */
  .section-head{
    display:flex; justify-content:space-between; align-items:flex-start;
    gap: 20px; margin-bottom: 18px; flex-wrap:wrap;
  }
  .section-head h2{
    font-family:'Unbounded', sans-serif;
    font-size: 22px; font-weight:600;
    margin: 0 0 4px;
    color: var(--pine-deep);
  }
  .section-head .sub{ color: var(--ink-soft); font-size: 14px; }

  /* ---------- Summary panel ---------- */
  .summary-panel{
    background: var(--paper);
    border-radius: var(--radius-l);
    box-shadow: var(--shadow);
    padding: 22px 24px;
    margin-bottom: 26px;
    display:grid;
    grid-template-columns: auto 1fr;
    gap: 26px;
    align-items:center;
  }
  .score-badge{
    display:flex; flex-direction:column; align-items:center;
    justify-content:center;
    width: 108px; height: 108px;
    border-radius: 50%;
    flex-shrink:0;
  }
  .score-badge .n{ font-family:'Unbounded',sans-serif; font-size: 30px; font-weight:600; line-height:1;}
  .score-badge .p{ font-size:11px; font-weight:700; margin-top:4px; opacity:.75;}
  .grade-excellent{ background: var(--green-soft); color: var(--green); }
  .grade-good{ background: #E4EEDD; color: #4B7A2E; }
  .grade-fair{ background: var(--amber-soft); color: var(--amber); }
  .grade-poor{ background: var(--red-soft); color: var(--red); }
  .grade-none{ background: var(--grey-soft); color: var(--grey); }

  .summary-mid{ display:flex; flex-direction:column; gap:10px; }
  .coverage-row{ display:flex; align-items:center; gap:12px; }
  .coverage-bar{
    flex:1; height:8px; border-radius:5px; background: var(--grey-soft);
    overflow:hidden; max-width: 320px;
  }
  .coverage-bar > div{ height:100%; background: var(--pine); border-radius:5px; }
  .coverage-txt{ font-size: 13.5px; color: var(--ink-soft); white-space:nowrap; }
  .focus-txt{ font-size: 14.5px; color: var(--ink); line-height:1.55; max-width: 640px; }
  .focus-txt b{ color: var(--pine-deep); font-weight:700; }

  /* ---------- Grids ---------- */
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }

  .card{
    background: var(--paper);
    border-radius: var(--radius-m);
    padding: 18px 18px 16px;
    box-shadow: var(--shadow);
    cursor:pointer;
    border: 1px solid transparent;
    transition: transform .12s ease, border-color .12s ease;
    display:flex; flex-direction:column; gap: 10px;
  }
  .card:hover{ transform: translateY(-2px); border-color: var(--line); }
  .card.unvisited{ cursor:pointer; opacity: .82; }
  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .card-name{ font-weight:700; font-size: 15.5px; color: var(--ink); line-height:1.3; }
  .card-sub{ font-size: 12.5px; color: var(--ink-faint); margin-top:2px; }
  .pill{
    font-size: 12px; font-weight:700; padding: 4px 10px; border-radius: 20px;
    white-space:nowrap; flex-shrink:0;
  }
  .pill-excellent{ background: var(--green-soft); color: var(--green); }
  .pill-good{ background: #E4EEDD; color: #4B7A2E; }
  .pill-fair{ background: var(--amber-soft); color: var(--amber); }
  .pill-poor{ background: var(--red-soft); color: var(--red); }
  .pill-none{ background: var(--grey-soft); color: var(--grey); }
  .mini-bar{ height:6px; border-radius:4px; background: var(--grey-soft); overflow:hidden;}
  .mini-bar > div{ height:100%; border-radius:4px; }
  .card-foot{ font-size: 12.5px; color: var(--ink-soft); }
  .card-foot .dash{ color: var(--ink-faint); }

  /* ---------- Store detail ---------- */
  .store-head{
    background: var(--paper); border-radius: var(--radius-l); box-shadow: var(--shadow);
    padding: 26px 28px; margin-bottom: 22px;
    display:grid; grid-template-columns: auto 1fr; gap: 26px; align-items:center;
  }
  .store-head h2{ font-family:'Unbounded',sans-serif; font-size: 24px; margin:0 0 4px; color: var(--pine-deep); }
  .store-loc{ color: var(--ink-soft); font-size: 14.5px; }
  .store-meta{ display:flex; gap: 18px; margin-top: 10px; flex-wrap:wrap; }
  .store-meta div{ font-size: 13px; color: var(--ink-faint); }
  .store-meta b{ color: var(--ink); font-weight:700; }

  .panel{
    background: var(--paper); border-radius: var(--radius-l); box-shadow: var(--shadow);
    padding: 22px 24px; margin-bottom: 20px;
  }
  .panel h3{
    font-family:'Unbounded', sans-serif; font-size: 16px; font-weight:600;
    margin: 0 0 16px; color: var(--pine-deep);
  }
  .two-col{ display:grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 760px){ .two-col{ grid-template-columns: 1fr; } .summary-panel{ grid-template-columns: 1fr; text-align:center;} .summary-panel .score-badge{ margin: 0 auto; } .coverage-row{justify-content:center;} }

  .bar-row{ display:grid; grid-template-columns: 168px 1fr 46px; align-items:center; gap: 10px; margin-bottom: 10px; font-size: 13.5px; }
  .bar-row .lbl{ color: var(--ink-soft); }
  .bar-track{ height: 9px; border-radius: 5px; background: var(--grey-soft); overflow:hidden; }
  .bar-track > div{ height:100%; border-radius:5px; }
  .bar-row .val{ text-align:right; font-weight:700; color: var(--ink); }

  .bar-fill-excellent{ background: var(--green); }
  .bar-fill-good{ background: #6FA24A; }
  .bar-fill-fair{ background: var(--amber); }
  .bar-fill-poor{ background: var(--red); }

  .empty-state{
    background: var(--paper); border-radius: var(--radius-l); box-shadow: var(--shadow);
    padding: 60px 30px; text-align:center; color: var(--ink-soft);
  }
  .empty-state .glyph{
    width: 56px; height:56px; border-radius:50%; background: var(--grey-soft); color: var(--grey);
    display:flex; align-items:center; justify-content:center; margin: 0 auto 18px;
    font-size: 24px; font-weight:700; font-family:'Unbounded',sans-serif;
  }
  .empty-state h3{ font-family:'Unbounded',sans-serif; color: var(--ink); font-size:18px; margin: 0 0 8px;}
  .empty-state p{ max-width: 420px; margin: 0 auto; font-size:14.5px; line-height:1.6; }

  .visit-dates{ display:flex; gap:8px; flex-wrap:wrap; margin-top: 4px; }
  .visit-dates span{
    font-size: 12px; background: var(--grey-soft); color: var(--ink-soft);
    padding: 4px 10px; border-radius: 20px; font-weight:600;
  }

  footer.foot{
    text-align:center; color: var(--ink-faint); font-size: 12.5px; margin-top: 40px;
  }
</style>
</head>

<script>
const DATA = JSON.parse(document.getElementById('site-data').textContent);

const GRADE_LABEL = {
  excellent: 'Відмінно',
  good: 'Добре',
  fair: 'Задовільно',
  poor: 'Потребує уваги',
  none: 'Немає даних'
};

function gradeOf(score){
  if(score === null || score === undefined) return 'none';
  if(score >= 90) return 'excellent';
  if(score >= 80) return 'good';
  if(score >= 70) return 'fair';
  return 'poor';
}

function fmt(n){ return (n === null || n === undefined) ? '—' : n.toFixed(1); }

function barFillClass(score){
  const g = gradeOf(score);
  return 'bar-fill-' + (g === 'none' ? 'poor' : g);
}

// ---------- Focus sentence generator ----------
function focusSentence(node){
  const focus = node.focus || [];
  if(!focus.length){
    return 'Недостатньо даних для визначення фокус-зон.';
  }
  const cats = focus.filter(f => f.type === 'category');
  const models = focus.filter(f => f.type === 'model');
  let parts = [];
  if(cats.length){
    const catStr = cats.map(c => `«${c.name}» (${fmt(c.score)} балів)`).join(' та ');
    parts.push(`найслабша перевірка — ${catStr}`);
  }
  if(models.length){
    const modelStr = models.map(m => m.name).join(' і ');
    parts.push(`нижчі результати стабільно показують шафи ${modelStr}`);
  }
  if(!parts.length) return 'Недостатньо даних для визначення фокус-зон.';
  return 'Фокус-зони: ' + parts.join('; ') + '.';
}

// ---------- Breadcrumb + state ----------
let state = { level: 'overview', regionId: null, districtId: null, storeCode: null };

function setState(next){
  state = Object.assign({}, state, next);
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function findRegion(id){ return DATA.regions.find(r => r.id === id); }
function findDistrict(region, id){ return region.districts.find(d => d.id === id); }
function findStore(district, code){ return district.stores.find(s => s.code === code); }

function renderCrumb(){
  const el = document.getElementById('crumb');
  let html = `<button class="${state.level==='overview'?'current':''}" onclick="setState({level:'overview',regionId:null,districtId:null,storeCode:null})">Уся мережа</button>`;
  if(state.regionId){
    const region = findRegion(state.regionId);
    html += `<span class="sep">/</span><button class="${state.level==='region'?'current':''}" onclick="setState({level:'region',districtId:null,storeCode:null})">${region.name}</button>`;
  }
  if(state.districtId){
    const region = findRegion(state.regionId);
    const district = findDistrict(region, state.districtId);
    html += `<span class="sep">/</span><button class="${state.level==='district'?'current':''}" onclick="setState({level:'district',storeCode:null})">${district.name}</button>`;
  }
  if(state.storeCode){
    const region = findRegion(state.regionId);
    const district = findDistrict(region, state.districtId);
    const store = findStore(district, state.storeCode);
    html += `<span class="sep">/</span><button class="current">${store.name}</button>`;
  }
  el.innerHTML = html;
}

function renderTopStats(){
  const m = DATA.meta;
  const pct = Math.round(m.total_visited / m.total_stores * 100);
  document.getElementById('topStats').innerHTML = `
    <div class="top-stat"><div class="num">${fmt(m.overall_score)}</div><div class="lbl">середній бал мережі</div></div>
    <div class="top-stat"><div class="num">${m.total_visited}/${m.total_stores}</div><div class="lbl">магазинів охоплено оцінюванням (${pct}%)</div></div>
    <div class="top-stat"><div class="num">${m.total_visits}</div><div class="lbl">проведено візитів</div></div>
  `;
}

// ---------- Summary panel (used at region / district / store levels) ----------
function summaryPanelHTML(node, kind){
  const grade = node.grade || 'none';
  const coveragePct = node.total_stores ? Math.round(node.visited_stores / node.total_stores * 100) : 0;
  let coverageLine = '';
  if(kind !== 'store'){
    coverageLine = `
      <div class="coverage-row">
        <div class="coverage-bar"><div style="width:${coveragePct}%; background:${coveragePct < 100 ? 'var(--amber)' : 'var(--pine)'}"></div></div>
        <div class="coverage-txt">${node.visited_stores} з ${node.total_stores} магазинів перевірено (${coveragePct}%)</div>
      </div>`;
  }
  return `
    <div class="summary-panel">
      <div class="score-badge grade-${grade}">
        <div class="n">${fmt(node.overall)}</div>
        <div class="p">${GRADE_LABEL[grade]}</div>
      </div>
      <div class="summary-mid">
        ${coverageLine}
        <div class="focus-txt">${focusSentence(node)}</div>
      </div>
    </div>`;
}

// ---------- Card renderers ----------
function regionCardHTML(region){
  const grade = region.grade || 'none';
  const coveragePct = Math.round(region.visited_stores / region.total_stores * 100);
  return `
    <div class="card" onclick="setState({level:'region', regionId:'${region.id}'})">
      <div class="card-top">
        <div><div class="card-name">${region.name}</div><div class="card-sub">${region.districts.length} дістриктів · ${region.total_stores} магазинів</div></div>
        <div class="pill pill-${grade}">${fmt(region.overall)}</div>
      </div>
      <div class="mini-bar"><div style="width:${coveragePct}%; background: var(--pine);"></div></div>
      <div class="card-foot">${region.visited_stores}/${region.total_stores} магазинів перевірено <span class="dash">·</span> ${region.total_visits} візитів</div>
    </div>`;
}

function districtCardHTML(region, district){
  const grade = district.grade || 'none';
  const coveragePct = Math.round(district.visited_stores / district.total_stores * 100);
  return `
    <div class="card" onclick="setState({level:'district', regionId:'${region.id}', districtId:'${district.id}'})">
      <div class="card-top">
        <div><div class="card-name">${district.name}</div><div class="card-sub">${district.total_stores} магазинів</div></div>
        <div class="pill pill-${grade}">${fmt(district.overall)}</div>
      </div>
      <div class="mini-bar"><div style="width:${coveragePct}%; background: var(--pine);"></div></div>
      <div class="card-foot">${district.visited_stores}/${district.total_stores} перевірено <span class="dash">·</span> ${district.total_visits} візитів</div>
    </div>`;
}

function storeCardHTML(region, district, store){
  if(!store.visited){
    return `
      <div class="card unvisited" onclick="setState({level:'store', regionId:'${region.id}', districtId:'${district.id}', storeCode:'${store.code}'})">
        <div class="card-top">
          <div><div class="card-name">${store.name}</div><div class="card-sub">${store.code}</div></div>
          <div class="pill pill-none">Немає даних</div>
        </div>
        <div class="mini-bar"><div style="width:0%"></div></div>
        <div class="card-foot">Оцінювання не проводилося</div>
      </div>`;
  }
  const grade = store.grade;
  return `
    <div class="card" onclick="setState({level:'store', regionId:'${region.id}', districtId:'${district.id}', storeCode:'${store.code}'})">
      <div class="card-top">
        <div><div class="card-name">${store.name}</div><div class="card-sub">${store.code}</div></div>
        <div class="pill pill-${grade}">${fmt(store.overall)}</div>
      </div>
      <div class="mini-bar"><div style="width:${store.overall}%; background: ${scoreColor(store.overall)};"></div></div>
      <div class="card-foot">${store.visits} ${store.visits===1?'візит':'візити'} <span class="dash">·</span> останній: ${store.dates[store.dates.length-1]}</div>
    </div>`;
}

function scoreColor(score){
  const g = gradeOf(score);
  return {excellent:'var(--green)', good:'#6FA24A', fair:'var(--amber)', poor:'var(--red)', none:'var(--grey)'}[g];
}

// ---------- Bars for category / model breakdown ----------
function barsHTML(dict, sortAsc){
  let entries = Object.entries(dict);
  if(sortAsc) entries.sort((a,b) => a[1]-b[1]);
  return entries.map(([name, score]) => `
    <div class="bar-row">
      <div class="lbl">${name}</div>
      <div class="bar-track"><div class="${barFillClass(score)}" style="width:${score}%"></div></div>
      <div class="val">${fmt(score)}</div>
    </div>`).join('');
}

// ---------- View renderers ----------
function renderOverview(){
  const html = `
    <div class="section-head">
      <div><h2>Регіони</h2><div class="sub">Оберіть регіон, щоб переглянути дістрикти та магазини</div></div>
    </div>
    <div class="grid">${DATA.regions.map(regionCardHTML).join('')}</div>
  `;
  document.getElementById('app').innerHTML = html;
}

function renderRegion(){
  const region = findRegion(state.regionId);
  const html = `
    ${summaryPanelHTML(region, 'region')}
    <div class="section-head">
      <div><h2>Дістрикти регіону «${region.name}»</h2><div class="sub">Відсортовано від найнижчого балу до найвищого</div></div>
    </div>
    <div class="grid">${region.districts.map(d => districtCardHTML(region, d)).join('')}</div>
  `;
  document.getElementById('app').innerHTML = html;
}

function renderDistrict(){
  const region = findRegion(state.regionId);
  const district = findDistrict(region, state.districtId);
  const html = `
    ${summaryPanelHTML(district, 'district')}
    <div class="panel">
      <h3>Результати по типах шаф і перевірках у дістрикті</h3>
      <div class="two-col">
        <div>
          <div class="card-sub" style="margin-bottom:10px; font-weight:700;">За категоріями перевірки</div>
          ${barsHTML(district.categories, true)}
        </div>
        <div>
          <div class="card-sub" style="margin-bottom:10px; font-weight:700;">За моделями шаф</div>
          ${barsHTML(district.models, true)}
        </div>
      </div>
    </div>
    <div class="section-head">
      <div><h2>Магазини дістрикту «${district.name}»</h2><div class="sub">Магазини без візиту показано окремо</div></div>
    </div>
    <div class="grid">${district.stores.map(s => storeCardHTML(region, district, s)).join('')}</div>
  `;
  document.getElementById('app').innerHTML = html;
}

function renderStore(){
  const region = findRegion(state.regionId);
  const district = findDistrict(region, state.districtId);
  const store = findStore(district, state.storeCode);

  if(!store.visited){
    document.getElementById('app').innerHTML = `
      <div class="store-head">
        <div class="score-badge grade-none"><div class="n">—</div><div class="p">Немає даних</div></div>
        <div>
          <h2>${store.name}</h2>
          <div class="store-loc">${store.code} · ${district.name}, ${region.name}</div>
        </div>
      </div>
      <div class="empty-state">
        <div class="glyph">!</div>
        <h3>Оцінювання ще не проводилося</h3>
        <p>Для магазину ${store.code} («${store.name}») ще не зафіксовано жодного візиту з оцінкою якості зборки шаф. Заплануйте оцінювання, щоб отримати перші дані.</p>
      </div>
    `;
    return;
  }

  const html = `
    <div class="store-head">
      <div class="score-badge grade-${store.grade}"><div class="n">${fmt(store.overall)}</div><div class="p">${GRADE_LABEL[store.grade]}</div></div>
      <div>
        <h2>${store.name}</h2>
        <div class="store-loc">${store.code} · ${district.name}, ${region.name}</div>
        <div class="store-meta">
          <div><b>${store.visits}</b> ${store.visits===1?'візит':'візити'}</div>
          <div>Дати: <div class="visit-dates" style="display:inline-flex;">${store.dates.map(d=>`<span>${d}</span>`).join('')}</div></div>
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="focus-txt" style="margin-bottom:18px;">${focusSentence(store)}</div>
      <div class="two-col">
        <div>
          <h3>За категоріями перевірки</h3>
          ${barsHTML(store.categories, true)}
        </div>
        <div>
          <h3>За моделями шаф</h3>
          ${barsHTML(store.models, true)}
        </div>
      </div>
    </div>
  `;
  document.getElementById('app').innerHTML = html;
}

function renderFooter(){
  const m = DATA.meta;
  document.getElementById('footerNote').textContent =
    `Дані базуються на ${m.total_visits} анкетах опитування · ${m.total_stores} магазинів у структурі мережі`;
}

function render(){
  renderCrumb();
  renderTopStats();
  renderFooter();
  if(state.level === 'overview') renderOverview();
  else if(state.level === 'region') renderRegion();
  else if(state.level === 'district') renderDistrict();
  else if(state.level === 'store') renderStore();
}

render();

</script>
</body>
</html>
