<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Оцінювання якості шаф · JYSK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EAEFEA;
    --paper: #FFFFFF;
    --ink: #16241E;
    --ink-soft: #55645B;
    --ink-faint: #8B9990;
    --pine: #1F3A32;
    --pine-deep: #142720;
    --line: #D7DFD8;
    --line-soft: #E4EAE4;
    --red: #C6272B;
    --red-soft: #F6DEDD;
    --amber: #C98A17;
    --amber-soft: #F5E7C9;
    --green: #2E7D4F;
    --green-soft: #DCEEE2;
    --grey: #8B9990;
    --grey-soft: #E7EAE6;
    --radius-s: 6px;
    --radius-m: 10px;
    --radius-l: 16px;
    --shadow: 0 1px 2px rgba(20,39,32,0.06), 0 8px 24px -12px rgba(20,39,32,0.18);
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Manrope', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height:100vh;
  }
  .wrap{
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 24px 80px;
  }

  /* ---------- Header ---------- */
  header.top{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap: 24px;
    flex-wrap: wrap;
    margin-bottom: 22px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--line);
  }
  .brandmark{
    display:flex; align-items:center; gap:10px;
    font-size: 13px; font-weight:700; letter-spacing:.02em;
    color: var(--ink-faint);
    margin-bottom: 10px;
  }
  .brandmark .dot{
    width:7px; height:7px; border-radius:50%; background: var(--red);
  }
  h1.title{
    font-family:'Unbounded', sans-serif;
    font-weight: 600;
    font-size: clamp(26px, 3.2vw, 38px);
    line-height: 1.08;
    margin: 0;
    color: var(--pine-deep);
    letter-spacing: -0.01em;
  }
  .top-stats{
    display:flex; gap: 26px; flex-wrap: wrap;
  }
  .top-stat{ text-align:right; }
  .top-stat .num{
    font-family:'Unbounded', sans-serif;
    font-size: 26px; font-weight:600;
    color: var(--pine-deep);
    line-height:1;
  }
  .top-stat .lbl{
    font-size: 12.5px; color: var(--ink-faint);
    margin-top: 5px;
    max-width: 140px;
  }

  /* ---------- Breadcrumb ---------- */
  nav.crumb{
    display:flex; align-items:center; flex-wrap:wrap;
    gap: 4px;
    margin-bottom: 26px;
    font-size: 14.5px;
  }
  nav.crumb button{
    background:none; border:none; cursor:pointer;
    font-family:'Manrope', sans-serif;
    font-size: 14.5px; font-weight:600;
    color: var(--ink-faint);
    padding: 5px 9px;
    border-radius: var(--radius-s);
  }
  nav.crumb button:hover{ background: var(--paper); color: var(--pine); }
  nav.crumb button.current{ color: var(--pine-deep); cursor:default; }
  nav.crumb button.current:hover{ background:none; }
  nav.crumb .sep{ color: var(--ink-faint); opacity:.5; font-size:13px; }

  /* ---------- Section header ---------- */
  .section-head{
    display:flex; justify-content:space-between; align-items:flex-start;
    gap: 20px; margin-bottom: 18px; flex-wrap:wrap;
  }
  .section-head h2{
    font-family:'Unbounded', sans-serif;
    font-size: 22px; font-weight:600;
    margin: 0 0 4px;
    color: var(--pine-deep);
  }
  .section-head .sub{ color: var(--ink-soft); font-size: 14px; }

  /* ---------- Summary panel ---------- */
  .summary-panel{
    background: var(--paper);
    border-radius: var(--radius-l);
    box-shadow: var(--shadow);
    padding: 22px 24px;
    margin-bottom: 26px;
    display:grid;
    grid-template-columns: auto 1fr;
    gap: 26px;
    align-items:center;
  }
  .score-badge{
    display:flex; flex-direction:column; align-items:center;
    justify-content:center;
    width: 108px; height: 108px;
    border-radius: 50%;
    flex-shrink:0;
  }
  .score-badge .n{ font-family:'Unbounded',sans-serif; font-size: 30px; font-weight:600; line-height:1;}
  .score-badge .p{ font-size:11px; font-weight:700; margin-top:4px; opacity:.75;}
  .grade-excellent{ background: var(--green-soft); color: var(--green); }
  .grade-good{ background: #E4EEDD; color: #4B7A2E; }
  .grade-fair{ background: var(--amber-soft); color: var(--amber); }
  .grade-poor{ background: var(--red-soft); color: var(--red); }
  .grade-none{ background: var(--grey-soft); color: var(--grey); }

  .summary-mid{ display:flex; flex-direction:column; gap:10px; }
  .coverage-row{ display:flex; align-items:center; gap:12px; }
  .coverage-bar{
    flex:1; height:8px; border-radius:5px; background: var(--grey-soft);
    overflow:hidden; max-width: 320px;
  }
  .coverage-bar > div{ height:100%; background: var(--pine); border-radius:5px; }
  .coverage-txt{ font-size: 13.5px; color: var(--ink-soft); white-space:nowrap; }
  .focus-txt{ font-size: 14.5px; color: var(--ink); line-height:1.55; max-width: 640px; }
  .focus-txt b{ color: var(--pine-deep); font-weight:700; }

  /* ---------- Grids ---------- */
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }

  .card{
    background: var(--paper);
    border-radius: var(--radius-m);
    padding: 18px 18px 16px;
    box-shadow: var(--shadow);
    cursor:pointer;
    border: 1px solid transparent;
    transition: transform .12s ease, border-color .12s ease;
    display:flex; flex-direction:column; gap: 10px;
  }
  .card:hover{ transform: translateY(-2px); border-color: var(--line); }
  .card.unvisited{ cursor:pointer; opacity: .82; }
  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .card-name{ font-weight:700; font-size: 15.5px; color: var(--ink); line-height:1.3; }
  .card-sub{ font-size: 12.5px; color: var(--ink-faint); margin-top:2px; }
  .pill{
    font-size: 12px; font-weight:700; padding: 4px 10px; border-radius: 20px;
    white-space:nowrap; flex-shrink:0;
  }
  .pill-excellent{ background: var(--green-soft); color: var(--green); }
  .pill-good{ background: #E4EEDD; color: #4B7A2E; }
  .pill-fair{ background: var(--amber-soft); color: var(--amber); }
  .pill-poor{ background: var(--red-soft); color: var(--red); }
  .pill-none{ background: var(--grey-soft); color: var(--grey); }
  .mini-bar{ height:6px; border-radius:4px; background: var(--grey-soft); overflow:hidden;}
  .mini-bar > div{ height:100%; border-radius:4px; }
  .card-foot{ font-size: 12.5px; color: var(--ink-soft); }
  .card-foot .dash{ color: var(--ink-faint); }

  /* ---------- Store detail ---------- */
  .store-head{
    background: var(--paper); border-radius: var(--radius-l); box-shadow: var(--shadow);
    padding: 26px 28px; margin-bottom: 22px;
    display:grid; grid-template-columns: auto 1fr; gap: 26px; align-items:center;
  }
  .store-head h2{ font-family:'Unbounded',sans-serif; font-size: 24px; margin:0 0 4px; color: var(--pine-deep); }
  .store-loc{ color: var(--ink-soft); font-size: 14.5px; }
  .store-meta{ display:flex; gap: 18px; margin-top: 10px; flex-wrap:wrap; }
  .store-meta div{ font-size: 13px; color: var(--ink-faint); }
  .store-meta b{ color: var(--ink); font-weight:700; }

  .panel{
    background: var(--paper); border-radius: var(--radius-l); box-shadow: var(--shadow);
    padding: 22px 24px; margin-bottom: 20px;
  }
  .panel h3{
    font-family:'Unbounded', sans-serif; font-size: 16px; font-weight:600;
    margin: 0 0 16px; color: var(--pine-deep);
  }
  .two-col{ display:grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 760px){ .two-col{ grid-template-columns: 1fr; } .summary-panel{ grid-template-columns: 1fr; text-align:center;} .summary-panel .score-badge{ margin: 0 auto; } .coverage-row{justify-content:center;} }

  .bar-row{ display:grid; grid-template-columns: 168px 1fr 46px; align-items:center; gap: 10px; margin-bottom: 10px; font-size: 13.5px; }
  .bar-row .lbl{ color: var(--ink-soft); }
  .bar-track{ height: 9px; border-radius: 5px; background: var(--grey-soft); overflow:hidden; }
  .bar-track > div{ height:100%; border-radius:5px; }
  .bar-row .val{ text-align:right; font-weight:700; color: var(--ink); }

  .bar-fill-excellent{ background: var(--green); }
  .bar-fill-good{ background: #6FA24A; }
  .bar-fill-fair{ background: var(--amber); }
  .bar-fill-poor{ background: var(--red); }

  .empty-state{
    background: var(--paper); border-radius: var(--radius-l); box-shadow: var(--shadow);
    padding: 60px 30px; text-align:center; color: var(--ink-soft);
  }
  .empty-state .glyph{
    width: 56px; height:56px; border-radius:50%; background: var(--grey-soft); color: var(--grey);
    display:flex; align-items:center; justify-content:center; margin: 0 auto 18px;
    font-size: 24px; font-weight:700; font-family:'Unbounded',sans-serif;
  }
  .empty-state h3{ font-family:'Unbounded',sans-serif; color: var(--ink); font-size:18px; margin: 0 0 8px;}
  .empty-state p{ max-width: 420px; margin: 0 auto; font-size:14.5px; line-height:1.6; }

  .visit-dates{ display:flex; gap:8px; flex-wrap:wrap; margin-top: 4px; }
  .visit-dates span{
    font-size: 12px; background: var(--grey-soft); color: var(--ink-soft);
    padding: 4px 10px; border-radius: 20px; font-weight:600;
  }

  footer.foot{
    text-align:center; color: var(--ink-faint); font-size: 12.5px; margin-top: 40px;
  }

  .toolbar{ display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:26px; }
  .toolbar nav.crumb{ margin-bottom:0; }
  .seg{ display:inline-flex; background:var(--paper); border-radius:10px; padding:3px; box-shadow:var(--shadow); }
  .seg button{ border:none; background:none; font-family:'Manrope',sans-serif; font-weight:700; font-size:13px; color:var(--ink-soft); padding:8px 14px; border-radius:8px; cursor:pointer; }
  .seg button.on{ background:var(--pine); color:#fff; }
  .seg button:not(.on):hover{ background:var(--bg); }

  .chip{ display:inline-block; font-size:12px; font-weight:800; padding:3px 9px; border-radius:20px; white-space:nowrap; }
  .chip-up{ background:var(--green-soft); color:var(--green); }
  .chip-down{ background:var(--red-soft); color:var(--red); }
  .chip-flat{ background:var(--grey-soft); color:var(--ink-soft); }
  .chip-none{ background:none; color:var(--ink-faint); }

  .dstrip{ display:flex; gap:10px; flex-wrap:wrap; }
  .dbox{ background:var(--bg); border-radius:10px; padding:10px 14px; min-width:128px; }
  .dbox .dl{ font-size:11.5px; font-weight:700; color:var(--ink-faint); }
  .dbox .dn{ font-family:'Unbounded',sans-serif; font-size:20px; font-weight:600; margin:4px 0 2px; }
  .dbox .ds{ font-size:11.5px; color:var(--ink-soft); }
  .dyn-txt{ color:var(--ink-soft); }
  .dline{ display:flex; align-items:center; justify-content:space-between; font-size:12.5px; font-weight:700; color:var(--ink-soft); }
  .dline-mute{ font-weight:600; color:var(--ink-faint); }
  .note{ background:var(--amber-soft); color:#7A5410; border-radius:8px; padding:9px 12px; font-size:13px; margin-bottom:14px; }

  .dtable .drow{ display:grid; grid-template-columns:1.5fr 1fr 1fr 86px; gap:14px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line-soft); font-size:13.5px; }
  .dtable .dhead{ font-size:12px; font-weight:700; color:var(--ink-faint); padding-top:0; }
  .dname{ font-weight:600; }
  .dcell{ display:flex; align-items:center; gap:8px; }
  .dbar{ flex:1; height:8px; border-radius:5px; background:var(--grey-soft); overflow:hidden; }
  .dbar > div{ height:100%; border-radius:5px; }
  .dv{ font-weight:800; min-width:38px; text-align:right; }
  .dv-none{ color:var(--ink-faint); font-weight:600; }

  svg.chart{ width:100%; height:auto; display:block; }
  svg.chart .gl{ stroke:var(--line-soft); stroke-width:1; }
  svg.chart .ax{ font:600 11px 'Manrope',sans-serif; fill:var(--ink-faint); }
  svg.chart .axn{ font:600 10.5px 'Manrope',sans-serif; fill:var(--ink-faint); }
  svg.chart .val{ font:800 12px 'Manrope',sans-serif; fill:var(--ink); }
  svg.chart .cut{ stroke:var(--red); stroke-width:1.5; stroke-dasharray:5 4; }
  svg.chart .cutl{ font:700 11px 'Manrope',sans-serif; fill:var(--red); }
  svg.chart .ln{ fill:none; stroke:var(--ink-faint); stroke-width:1.5; opacity:.6; }
  svg.chart .dot{ stroke:#fff; stroke-width:2; }
  .visit-dates span.after{ background:var(--green-soft); color:var(--green); }
  .store-head .dstrip{ margin:12px 0 10px; }
  @media (max-width:760px){
    .dtable .drow{ grid-template-columns:1fr 1fr; gap:6px 12px; }
    .dtable .dhead{ display:none; }
    .dtable .dname{ grid-column:1 / -1; }
    .store-head{ grid-template-columns:1fr; }
  }
</style>
</head>

<script>
const D = JSON.parse(document.getElementById('site-data').textContent);

const PLABEL = { all: 'Весь період', before: 'До 01.09.2026', after: 'Після 01.09.2026' };
const GRADE_LABEL = { excellent: 'Відмінно', good: 'Добре', fair: 'Задовільно', poor: 'Потребує уваги', none: 'Немає даних' };
const MONTHS = ['2026-06', '2026-07', '2026-08', '2026-09', '2026-10'];
const MONTH_NAMES = ['Червень', 'Липень', 'Серпень', 'Вересень', 'Жовтень'];

let state = { level: 'overview', regionId: null, districtId: null, storeCode: null, period: 'all' };

/* ---------- helpers ---------- */
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function gradeOf(s) {
  if (s === null || s === undefined) return 'none';
  if (s >= 90) return 'excellent';
  if (s >= 80) return 'good';
  if (s >= 70) return 'fair';
  return 'poor';
}
function gradeColor(s) {
  return { excellent: 'var(--green)', good: '#6FA24A', fair: 'var(--amber)', poor: 'var(--red)', none: 'var(--grey)' }[gradeOf(s)];
}
function fmt(n) { return (n === null || n === undefined) ? '—' : n.toFixed(1); }
function visWord(n) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return 'візит';
  if (m10 >= 2 && m10 <= 4 && !(m100 >= 12 && m100 <= 14)) return 'візити';
  return 'візитів';
}
function fmtDate(iso) { const [y, m, d] = iso.split('-'); return `${d}.${m}.${y}`; }
function P(n, per) { return n.p[per || state.period]; }
function sc(n, per) { const p = P(n, per); return p ? p.o : null; }
function delta(n) {
  const b = n.p.before, a = n.p.after;
  return (b && a) ? Math.round((a.o - b.o) * 10) / 10 : null;
}
function chip(d) {
  if (d === null || d === undefined) return '<span class="chip chip-none">—</span>';
  const cls = d >= 2 ? 'up' : d <= -2 ? 'down' : 'flat';
  const arrow = d >= 2 ? '▲' : d <= -2 ? '▼' : '≈';
  const sign = d > 0 ? '+' : d < 0 ? '−' : '';
  return `<span class="chip chip-${cls}">${arrow} ${sign}${Math.abs(d).toFixed(1)}</span>`;
}
function sortNodes(arr) {
  return arr.slice().sort((x, y) => {
    const a = sc(x), b = sc(y);
    if (a === null && b === null) return (x.code || x.name).localeCompare(y.code || y.name);
    if (a === null) return 1;
    if (b === null) return -1;
    return a - b;
  });
}

/* ---------- focus + dynamics text ---------- */
function focusText(n) {
  const p = P(n);
  if (!p) return 'У вибраному періоді немає даних для визначення фокус-зон.';
  const cats = Object.entries(p.c).filter(e => e[1] !== null).sort((a, b) => a[1] - b[1]).slice(0, 2);
  const models = Object.entries(p.m).filter(e => e[1] !== null).sort((a, b) => a[1] - b[1]).slice(0, 2);
  const parts = [];
  if (cats.length) parts.push('найслабша перевірка — ' + cats.map(c => `«${esc(c[0])}» (${fmt(c[1])})`).join(' та '));
  if (models.length) parts.push('нижчі результати показують артикули ' + models.map(m => `<b>${esc(m[0])}</b> (${fmt(m[1])})`).join(' і '));
  return 'Фокус-зони: ' + parts.join('; ') + '.';
}
function dynamicsText(n) {
  const b = n.p.before, a = n.p.after;
  if (!b && !a) return '';
  if (!b || !a) return `Порівняння до/після 01.09 неможливе: є візити лише ${a ? 'після' : 'до'} 01.09.`;
  const diffs = D.models
    .map(k => ({ k, d: (a.m[k] !== null && b.m[k] !== null) ? a.m[k] - b.m[k] : null }))
    .filter(x => x.d !== null);
  const down = diffs.filter(x => x.d <= -3).sort((x, y) => x.d - y.d).slice(0, 3);
  const up = diffs.filter(x => x.d >= 3).sort((x, y) => y.d - x.d).slice(0, 3);
  const f = x => `<b>${esc(x.k)}</b> (${x.d > 0 ? '+' : '−'}${Math.abs(x.d).toFixed(1)})`;
  const parts = [];
  if (down.length) parts.push('просіли — ' + down.map(f).join(', '));
  if (up.length) parts.push('зросли — ' + up.map(f).join(', '));
  if (!parts.length) return 'Динаміка: суттєвих змін по артикулах (±3 бали) немає.';
  return 'Динаміка після 01.09: ' + parts.join('; ') + '.';
}

/* ---------- charts ---------- */
function monthlyChart(n) {
  const W = 640, H = 230, pl = 40, pr = 14, pt = 20, pb = 54;

  });
  const cutX = pl + 3 * cw;
  g += `<line x1="${cutX}" x2="${cutX}" y1="${pt - 6}" y2="${H - pb + 6}" class="cut"/>`;
  g += `<text x="${cutX - 8}" y="${pt - 6}" class="cutl" text-anchor="end">до 01.09</text><text x="${cutX + 8}" y="${pt - 6}" class="cutl">після 01.09</text>`;
  const pts = [];
  MONTHS.forEach((mk, i) => {
    g += `<text x="${x(i)}" y="${H - pb + 22}" class="ax" text-anchor="middle">${MONTH_NAMES[i]}</text>`;
    const m = byM[mk];
    if (m) {
      pts.push([x(i), y(m.o), m]);
      g += `<text x="${x(i)}" y="${H - pb + 38}" class="axn" text-anchor="middle">${m.n} ${visWord(m.n)}</text>`;
    } else {
      g += `<text x="${x(i)}" y="${H - pb + 38}" class="axn" text-anchor="middle">немає візитів</text>`;
    }
  });
  if (pts.length > 1) g += `<polyline points="${pts.map(p => p[0] + ',' + p[1]).join(' ')}" class="ln"/>`;
  pts.forEach(p => {
    g += `<circle cx="${p[0]}" cy="${p[1]}" r="6" style="fill:${gradeColor(p[2].o)}" class="dot"/><text x="${p[0]}" y="${p[1] - 12}" class="val" text-anchor="middle">${fmt(p[2].o)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Середній бал по місяцях">${g}</svg>`;
}

function storeTimeline(s) {
  const W = 640, H = 230, pl = 40, pr = 20, pt = 22, pb = 40;
  const t0 = Date.parse('2026-06-01'), t1 = Date.parse('2026-10-15');
  const X = iso => pl + (Date.parse(iso) - t0) / (t1 - t0) * (W - pl - pr);
  const scores = s.v.map(v => v.s);
  const ymin = Math.max(0, Math.min(60, Math.floor(Math.min(...scores) / 10) * 10 - 10));
  const ch = H - pt - pb;
  const Y = v => pt + (100 - v) / (100 - ymin) * ch;
  let g = '';
  for (let v = ymin; v <= 100; v += 10) {
    g += `<line x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}" class="gl"/><text x="${pl - 8}" y="${Y(v) + 4}" class="ax" text-anchor="end">${v}</text>`;
  }
  ['2026-06-01', '2026-07-01', '2026-08-01', '2026-09-01', '2026-10-01'].forEach((d, i) => {
    g += `<text x="${X(d)}" y="${H - 10}" class="ax">${['чер', 'лип', 'сер', 'вер', 'жов'][i]}</text>`;
  });
  const cx = X('2026-09-01');
  g += `<line x1="${cx}" x2="${cx}" y1="${pt - 8}" y2="${H - pb + 4}" class="cut"/>`;
  g += `<text x="${cx - 8}" y="${pt - 8}" class="cutl" text-anchor="end">до 01.09</text><text x="${cx + 8}" y="${pt - 8}" class="cutl">після 01.09</text>`;
  if (s.v.length > 1) g += `<polyline points="${s.v.map(v => X(v.d) + ',' + Y(v.s)).join(' ')}" class="ln"/>`;
  s.v.forEach(v => {
    g += `<circle cx="${X(v.d)}" cy="${Y(v.s)}" r="6" style="fill:${gradeColor(v.s)}" class="dot"/>`;
    g += `<text x="${X(v.d)}" y="${Y(v.s) - 12}" class="val" text-anchor="middle">${fmt(v.s)}</text>`;
    g += `<text x="${X(v.d)}" y="${Y(v.s) + 22}" class="axn" text-anchor="middle">${fmtDate(v.d).slice(0, 5)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Оцінки по візитах">${g}</svg>`;
}

/* ---------- dynamics table ---------- */
function barCell(v) {
  if (v === null || v === undefined) return '<div class="dcell"><span class="dv dv-none">—</span></div>';
  return `<div class="dcell"><div class="dbar"><div style="width:${v}%;background:${gradeColor(v)}"></div></div><span class="dv">${fmt(v)}</span></div>`;
}
function dynTable(n, kind) {
  const keys = kind === 'art' ? D.models : D.cats;
  const f = kind === 'art' ? 'm' : 'c';
  const b = n.p.before, a = n.p.after;
  const rows = keys.map(k => {
    const bv = b ? b[f][k] : null, av = a ? a[f][k] : null;
    return { k, b: bv, a: av, d: (bv !== null && av !== null) ? Math.round((av - bv) * 10) / 10 : null };
  });
  rows.sort((x, y) => {
    if (x.d !== null && y.d !== null) return x.d - y.d;
    if (x.d !== null) return -1;
    if (y.d !== null) return 1;
    const xs = x.a !== null ? x.a : (x.b !== null ? x.b : 999);
    const ys = y.a !== null ? y.a : (y.b !== null ? y.b : 999);
    return xs - ys;
  });
  const head = `
    <div class="drow dhead">
      <div>${kind === 'art' ? 'Артикул' : 'Перевірка'}</div>
      <div>До 01.09${b ? ` · ${b.n} ${visWord(b.n)}` : ''}</div>
      <div>Після 01.09${a ? ` · ${a.n} ${visWord(a.n)}` : ''}</div>
      <div>Зміна</div>
    </div>`;
  return `<div class="dtable">${head}${rows.map(r => `
    <div class="drow">
      <div class="dname">${esc(r.k)}</div>
      ${barCell(r.b)}
      ${barCell(r.a)}
      <div>${chip(r.d)}</div>
    </div>`).join('')}</div>`;
}

function dynPanel(n, isStore) {
  const chart = isStore
    ? `<h3>Оцінки по візитах</h3>${storeTimeline(n)}`
    : `<h3>Середній бал по місяцях</h3>${monthlyChart(n)}`;
  const nb = !n.p.before || !n.p.after;
  return `
    <div class="panel">
      ${chart}
    </div>
    <div class="panel">
      <h3>Динаміка по артикулах: до і після 01.09.2026</h3>
      ${nb ? `<div class="note">Порівняння неможливе: ${n.p.after ? 'немає візитів до 01.09' : 'немає візитів після 01.09'}. Показано дані наявного періоду.</div>` : ''}
      ${dynTable(n, 'art')}
    </div>
    <div class="panel">
      <h3>Динаміка по перевірках</h3>
      ${dynTable(n, 'cat')}
    </div>`;
}

/* ---------- summary ---------- */
function dynStrip(n) {
  const b = n.p.before, a = n.p.after;
  const box = (lbl, p) => `<div class="dbox"><div class="dl">${lbl}</div><div class="dn" style="color:${p ? gradeColor(p.o) : 'var(--grey)'}">${p ? fmt(p.o) : '—'}</div><div class="ds">${p ? `${p.n} ${visWord(p.n)}` : 'немає візитів'}</div></div>`;
  return `<div class="dstrip">${box('До 01.09.2026', b)}${box('Після 01.09.2026', a)}<div class="dbox"><div class="dl">Зміна</div><div class="dn">${chip(delta(n))}</div><div class="ds">після порівняно з до</div></div></div>`;
}
function summaryPanel(n, kind) {
  const p = P(n);
  const grade = gradeOf(p ? p.o : null);
  let cov = '';
  if (kind !== 'store') {
    const st = p ? p.st : 0;
    const pct = n.total ? Math.round(st / n.total * 100) : 0;
    cov = `<div class="coverage-row"><div class="coverage-bar"><div style="width:${pct}%;background:${pct < 100 ? 'var(--amber)' : 'var(--pine)'}"></div></div><div class="coverage-txt">${st} з ${n.total} магазинів оцінено · ${PLABEL[state.period].toLowerCase()}</div></div>`;
  }
  const dt = dynamicsText(n);
  return `
    <div class="summary-panel">
      <div class="score-badge grade-${grade}"><div class="n">${p ? fmt(p.o) : '—'}</div><div class="p">${GRADE_LABEL[grade]}</div></div>
      <div class="summary-mid">
        ${cov}
        ${dynStrip(n)}
        <div class="focus-txt">${focusText(n)}</div>
        ${dt ? `<div class="focus-txt dyn-txt">${dt}</div>` : ''}
      </div>
    </div>`;
}

/* ---------- cards ---------- */
function deltaLine(n) {
  const b = n.p.before, a = n.p.after;
  if (b && a) return `<div class="dline"><span>${fmt(b.o)} → ${fmt(a.o)}</span>${chip(delta(n))}</div>`;
  if (b || a) return `<div class="dline dline-mute">лише ${a ? 'після' : 'до'} 01.09</div>`;
  return '';
}
function aggCard(n, onclick) {
  const p = P(n);
  const pct = p && n.total ? Math.round(p.st / n.total * 100) : 0;
  return `
    <div class="card" role="button" tabindex="0" onclick="${onclick}" onkeydown="if(event.key==='Enter')${onclick}">
      <div class="card-top">
        <div><div class="card-name">${esc(n.name)}</div><div class="card-sub">${n.districts ? n.districts.length + ' дістриктів · ' : ''}${n.total} магазинів</div></div>
        <div class="pill pill-${gradeOf(p ? p.o : null)}">${p ? fmt(p.o) : 'Немає даних'}</div>
      </div>
      <div class="mini-bar"><div style="width:${pct}%;background:var(--pine)"></div></div>
      <div class="card-foot">${p ? `${p.st}/${n.total} оцінено <span class="dash">·</span> ${p.n} ${visWord(p.n)}` : 'Немає візитів у цьому періоді'}</div>
      ${deltaLine(n)}
    </div>`;
}
function storeCard(r, d, s) {
  const p = P(s);
  const any = s.p.all;
  const oc = `setState({level:'store',regionId:'${r.id}',districtId:'${d.id}',storeCode:'${s.code}'})`;
  if (!p) {
    const note = any ? `Немає візитів у цьому періоді · є візити ${s.p.after ? 'після' : 'до'} 01.09` : 'Оцінювання не проводилося';
    return `
      <div class="card unvisited" role="button" tabindex="0" onclick="${oc}" onkeydown="if(event.key==='Enter')${oc}">
        <div class="card-top"><div><div class="card-name">${esc(s.name)}</div><div class="card-sub">${s.code}</div></div><div class="pill pill-none">Без даних</div></div>
        <div class="mini-bar"><div style="width:0%"></div></div>
        <div class="card-foot">${note}</div>
      </div>`;
  }
  return `
    <div class="card" role="button" tabindex="0" onclick="${oc}" onkeydown="if(event.key==='Enter')${oc}">
      <div class="card-top"><div><div class="card-name">${esc(s.name)}</div><div class="card-sub">${s.code}</div></div><div class="pill pill-${gradeOf(p.o)}">${fmt(p.o)}</div></div>
      <div class="mini-bar"><div style="width:${p.o}%;background:${gradeColor(p.o)}"></div></div>
      <div class="card-foot">${p.n} ${visWord(p.n)}</div>
      ${deltaLine(s)}
    </div>`;
}

/* ---------- navigation ---------- */
function setState(next) {
  const levelChanged = next.level && next.level !== state.level || next.storeCode !== undefined || next.districtId !== undefined || next.regionId !== undefined;
  state = Object.assign({}, state, next);
  render();
  if (levelChanged) window.scrollTo({ top: 0, behavior: 'smooth' });
}
function setPeriod(p) { setState({ period: p }); }
function findRegion(id) { return D.regions.find(r => r.id === id); }
function findDistrict(r, id) { return r.districts.find(d => d.id === id); }
function findStore(d, c) { return d.stores.find(s => s.code === c); }

function renderCrumb() {
  let h = `<button class="${state.level === 'overview' ? 'current' : ''}" onclick="setState({level:'overview',regionId:null,districtId:null,storeCode:null})">Уся мережа</button>`;
  if (state.regionId) {
    const r = findRegion(state.regionId);
    h += `<span class="sep">/</span><button class="${state.level === 'region' ? 'current' : ''}" onclick="setState({level:'region',districtId:null,storeCode:null})">${esc(r.name)}</button>`;
    if (state.districtId) {
      const d = findDistrict(r, state.districtId);
      h += `<span class="sep">/</span><button class="${state.level === 'district' ? 'current' : ''}" onclick="setState({level:'district',storeCode:null})">${esc(d.name)}</button>`;
      if (state.storeCode) {
        const s = findStore(d, state.storeCode);
        h += `<span class="sep">/</span><button class="current">${esc(s.name)}</button>`;
      }
    }
  }
  document.getElementById('crumb').innerHTML = h;
}
function renderSeg() {
  document.getElementById('seg').innerHTML = ['all', 'before', 'after'].map(k =>
    `<button class="${state.period === k ? 'on' : ''}" onclick="setPeriod('${k}')">${PLABEL[k]}</button>`).join('');
}
function renderTopStats() {
  const p = P(D.net);
  const st = p ? p.st : 0, pct = Math.round(st / D.net.total * 100);
  document.getElementById('topStats').innerHTML = `
    <div class="top-stat"><div class="num">${p ? fmt(p.o) : '—'}</div><div class="lbl">середній бал мережі · ${PLABEL[state.period].toLowerCase()}</div></div>
    <div class="top-stat"><div class="num">${st}/${D.net.total}</div><div class="lbl">магазинів оцінено (${pct}%)</div></div>
    <div class="top-stat"><div class="num">${p ? p.n : 0}</div><div class="lbl">${p ? visWord(p.n) : 'візитів'} за період</div></div>`;
}
function renderFooter() {
  const m = D.meta;
  document.getElementById('footerNote').innerHTML =
    `Дані: ${m.visits} анкет з ${fmtDate(m.from)} по ${fmtDate(m.to)} · ${m.stores} магазинів у структурі мережі<br>` +
    `Бал — середній відсоток від максимуму по всіх відповідях (шкала 1–3 та Так/Ні). «До» — візити до 01.09.2026, «Після» — з 01.09.2026.`;
}

/* ---------- views ---------- */
function head(title, sub) { return `<div class="section-head"><div><h2>${title}</h2><div class="sub">${sub}</div></div></div>`; }
const SORT_NOTE = 'Відсортовано від найнижчого балу у вибраному періоді';

function renderOverview() {
  document.getElementById('app').innerHTML =
    summaryPanel(D.net, 'net') + dynPanel(D.net, false) +
    head('Регіони', SORT_NOTE) +
    `<div class="grid">${sortNodes(D.regions).map(r => aggCard(r, `setState({level:'region',regionId:'${r.id}'})`)).join('')}</div>`;
}
function renderRegion() {
  const r = findRegion(state.regionId);
  document.getElementById('app').innerHTML =
    summaryPanel(r, 'region') + dynPanel(r, false) +
    head(`Дістрикти регіону «${esc(r.name)}»`, SORT_NOTE) +
    `<div class="grid">${sortNodes(r.districts).map(d => aggCard(d, `setState({level:'district',regionId:'${r.id}',districtId:'${d.id}'})`)).join('')}</div>`;
}
function renderDistrict() {
  const r = findRegion(state.regionId), d = findDistrict(r, state.districtId);
  const noData = d.stores.filter(s => !s.p[state.period]).length;
  document.getElementById('app').innerHTML =
    summaryPanel(d, 'district') + dynPanel(d, false) +
    head(`Магазини дістрикту «${esc(d.name)}»`, `${SORT_NOTE}. Без даних у періоді: ${noData}`) +
    `<div class="grid">${sortNodes(d.stores).map(s => storeCard(r, d, s)).join('')}</div>`;
}
function renderStore() {
  const r = findRegion(state.regionId), d = findDistrict(r, state.districtId), s = findStore(d, state.storeCode);
  const loc = `${s.code} · ${esc(d.name)}, ${esc(r.name)}`;
  if (!s.p.all) {
    document.getElementById('app').innerHTML = `
      <div class="store-head"><div class="score-badge grade-none"><div class="n">—</div><div class="p">Немає даних</div></div>
      <div><h2>${esc(s.name)}</h2><div class="store-loc">${loc}</div></div></div>
      <div class="empty-state"><div class="glyph">!</div><h3>Оцінювання ще не проводилося</h3>
      <p>Для магазину ${s.code} («${esc(s.name)}») ще не зафіксовано жодного візиту з оцінкою якості зборки шаф. Заплануйте оцінювання, щоб отримати перші дані.</p></div>`;
    return;
  }
  const p = P(s);
  const grade = gradeOf(p ? p.o : null);
  const dates = s.v.map(v => `<span class="${v.b ? '' : 'after'}">${fmtDate(v.d)} · ${fmt(v.s)}</span>`).join('');
  const dt = dynamicsText(s);
  document.getElementById('app').innerHTML = `
    <div class="store-head">
      <div class="score-badge grade-${grade}"><div class="n">${p ? fmt(p.o) : '—'}</div><div class="p">${p ? GRADE_LABEL[grade] : 'Немає даних у періоді'}</div></div>
      <div>
        <h2>${esc(s.name)}</h2>
        <div class="store-loc">${loc}</div>
        ${dynStrip(s)}
        <div class="visit-dates">${dates}</div>
      </div>
    </div>
    <div class="panel">
      <div class="focus-txt">${focusText(s)}</div>
      ${dt ? `<div class="focus-txt dyn-txt">${dt}</div>` : ''}
    </div>
    ${dynPanel(s, true)}`;
}

function render() {
  renderCrumb(); renderSeg(); renderTopStats(); renderFooter();
  if (state.level === 'overview') renderOverview();
  else if (state.level === 'region') renderRegion();
  else if (state.level === 'district') renderDistrict();
  else renderStore();
}
render();

</script>
</body>
</html>
